# Cloudflare Pages configuration.
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# `name` must match the Pages project name you create in the Cloudflare
# dashboard (or `wrangler pages project create`). Change it if you pick a
# different project name.
name = "raramalivingstudio"

# The site is served straight from the repository root — index.html, /assets,
# /rooms, /gallery, etc. are all here, so the build output directory is ".".
pages_build_output_dir = "."

compatibility_date = "2024-11-01"
